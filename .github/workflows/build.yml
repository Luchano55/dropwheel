name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Утилиты
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libheif-plugin-libde265 libheif-plugin-aomenc
      - name: Тесты
        run: dotnet test -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Скачать ffmpeg и ImageMagick
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/fetch-tools.ps1 -Destination tools
      - name: Тесты
        shell: pwsh
        run: |
          $env:DROPWHEEL_FFMPEG = "$PWD\tools\ffmpeg\ffmpeg.exe"
          $env:DROPWHEEL_MAGICK = "$PWD\tools\imagemagick\magick.exe"
          dotnet test -c Release --logger "console;verbosity=normal"
      - name: Сборка
        shell: pwsh
        run: |
          $common = @("-c", "Release", "-r", "win-x64", "--self-contained",
            "-p:PublishSingleFile=true", "-p:IncludeNativeLibrariesForSelfExtract=true",
            "-p:EnableCompressionInSingleFile=true", "-p:DebugType=None", "-o", "out/DropWheel")
          dotnet publish src/DropWheel @common
          dotnet publish src/DropWheel.Cli @common
          Copy-Item tools out/DropWheel/tools -Recurse
          # ffprobe нужен только тестам.
          Remove-Item out/DropWheel/tools/ffmpeg/ffprobe.exe -ErrorAction SilentlyContinue
          Copy-Item packaging/* out/DropWheel/
          Get-ChildItem out/DropWheel -Recurse -File | Sort-Object Length -Descending | Select-Object -First 8 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName }
          Compress-Archive out/DropWheel DropWheel-win-x64.zip
          "{0:N1} MB zip" -f ((Get-Item DropWheel-win-x64.zip).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: DropWheel-win-x64
          path: out/DropWheel
      - name: Обновить релиз dev-build
        # Тестовую сборку для Романа обновляет только основная рабочая ветка.
        if: github.ref == 'refs/heads/claude/dropwheel-stage1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>$null
          gh release create dev-build DropWheel-win-x64.zip --prerelease --target $env:GITHUB_SHA `
            --title "Тестовая сборка ($env:GITHUB_REF_NAME)" `
            --notes "Свежая сборка из ветки $env:GITHUB_REF_NAME, коммит $env:GITHUB_SHA. Инструкция — в README."
