name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Утилиты
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libheif-plugin-libde265 libheif-plugin-aomenc librsvg2-bin qpdf poppler-utils 7zip
      - name: Тесты
        run: dotnet test -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Скачать ffmpeg, ImageMagick, qpdf, poppler и 7-Zip
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/fetch-tools.ps1 -Destination tools
      - name: Тесты
        shell: pwsh
        run: |
          $env:DROPWHEEL_FFMPEG = "$PWD\tools\ffmpeg\ffmpeg.exe"
          $env:DROPWHEEL_MAGICK = "$PWD\tools\imagemagick\magick.exe"
          $env:DROPWHEEL_QPDF = "$PWD\tools\qpdf\qpdf.exe"
          $env:DROPWHEEL_PDFTOPPM = "$PWD\tools\poppler\pdftoppm.exe"
          $env:DROPWHEEL_PDFTOTEXT = "$PWD\tools\poppler\pdftotext.exe"
          $env:DROPWHEEL_7Z = "$PWD\tools\7zip\7z.exe"
          dotnet test -c Release --logger "console;verbosity=normal"
      - name: Windows-тесты и скриншоты интерфейса
        shell: pwsh
        run: |
          $env:DROPWHEEL_SCREENSHOTS = "$PWD\screenshots"
          dotnet test tests/DropWheel.Windows.Tests -c Release --logger "console;verbosity=normal"
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Скриншоты в ветку screenshots
        # Свежие картинки интерфейса: их видно в README и их может забрать разработчик (git fetch).
        if: always() && github.event_name != 'pull_request' && hashFiles('screenshots/*.png') != ''
        shell: pwsh
        run: |
          $branch = "$env:GITHUB_REF_NAME" -replace '[^A-Za-z0-9._-]', '-'
          $dir = "$env:RUNNER_TEMP\shots"
          git worktree add --detach $dir
          Push-Location $dir
          git checkout --orphan screenshots-tmp
          git rm -rf . --quiet
          New-Item -ItemType Directory $branch -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\screenshots\*" $branch -Recurse
          # Сохраняем картинки других веток, если ветка screenshots уже есть.
          git fetch origin screenshots 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout FETCH_HEAD -- . 2>$null
            Remove-Item $branch -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory $branch -Force | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\screenshots\*" $branch -Recurse
          }
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -m "Скриншоты: $env:GITHUB_REF_NAME $env:GITHUB_SHA" --quiet
          git push --force origin HEAD:screenshots
          Pop-Location
      - name: Сборка
        shell: pwsh
        run: |
          # Номер сборки = номер запуска CI: по нему программа понимает, что есть обновление.
          $common = @("-c", "Release", "-r", "win-x64", "--self-contained",
            "-p:PublishSingleFile=true", "-p:IncludeNativeLibrariesForSelfExtract=true",
            "-p:EnableCompressionInSingleFile=true", "-p:DebugType=None",
            "-p:Version=0.2.$env:GITHUB_RUN_NUMBER", "-p:SourceRevisionId=$env:GITHUB_SHA",
            "-o", "out/DropWheel")
          dotnet publish src/DropWheel @common
          dotnet publish src/DropWheel.Cli @common
          Copy-Item tools out/DropWheel/tools -Recurse
          # ffprobe нужен только тестам.
          Remove-Item out/DropWheel/tools/ffmpeg/ffprobe.exe -ErrorAction SilentlyContinue
          Copy-Item packaging/* out/DropWheel/

          # Версия набора утилит = хэш всех их файлов: обновление перекачивает утилиты, только если она сменилась.
          $root = (Resolve-Path out/DropWheel/tools).Path
          $sig = Get-ChildItem $root -Recurse -File | Sort-Object FullName |
            ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + " " + $_.FullName.Substring($root.Length) }
          $toolsVersion = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($sig -join "`n"))).Substring(0, 16)
          Set-Content out/DropWheel/tools/tools-version.txt $toolsVersion -NoNewline

          Get-ChildItem out/DropWheel -Recurse -File | Sort-Object Length -Descending | Select-Object -First 8 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName }

          # Три архива: полный (первая установка), программа и утилиты (обновления). Внутри всегда папка DropWheel/.
          New-Item -ItemType Directory out/app/DropWheel, out/tools/DropWheel | Out-Null
          Get-ChildItem out/DropWheel | Where-Object Name -ne "tools" | Copy-Item -Destination out/app/DropWheel -Recurse
          Copy-Item out/DropWheel/tools out/tools/DropWheel/tools -Recurse
          Compress-Archive out/DropWheel DropWheel-win-x64.zip
          Compress-Archive out/app/DropWheel DropWheel-app-win-x64.zip
          Compress-Archive out/tools/DropWheel DropWheel-tools-win-x64.zip

          $manifest = [ordered]@{
            build = [int]$env:GITHUB_RUN_NUMBER
            commit = $env:GITHUB_SHA
            toolsVersion = $toolsVersion
            appZip = "DropWheel-app-win-x64.zip"
            appSha256 = (Get-FileHash DropWheel-app-win-x64.zip -Algorithm SHA256).Hash
            toolsZip = "DropWheel-tools-win-x64.zip"
            toolsSha256 = (Get-FileHash DropWheel-tools-win-x64.zip -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json | Set-Content version.json -Encoding utf8NoBOM
          Get-Content version.json
          Get-ChildItem *.zip | ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }
      - uses: actions/upload-artifact@v4
        with:
          name: DropWheel-win-x64
          path: out/DropWheel
      - name: Обновить релиз dev-build
        # Сборку для пользователей (релиз dev-build) обновляет только main.
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>$null
          gh release create dev-build DropWheel-win-x64.zip DropWheel-app-win-x64.zip DropWheel-tools-win-x64.zip version.json `
            --prerelease --target $env:GITHUB_SHA `
            --title "Тестовая сборка $env:GITHUB_RUN_NUMBER" `
            --notes "Первая установка — DropWheel-win-x64.zip (всё сразу). Дальше программа обновляется сама (трей → «Обновить»). Сборка $env:GITHUB_RUN_NUMBER, ветка $env:GITHUB_REF_NAME, коммит $env:GITHUB_SHA."
